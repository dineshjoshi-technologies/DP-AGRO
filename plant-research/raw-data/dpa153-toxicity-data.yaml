assay_protocol:
  cell_line_details:
    name: "L-929 mouse fibroblast cells"
    atcc_crl: "CCL-1"
    passage_range: "Passages 5-20 recommended"
    media: "DMEM + 10% FBS + 1% penicillin/streptomycin"
    seeding_density: "5000-10000 cells per well in 96-well plate"
    incubation: "37 C, 5% CO2, 95% humidity"
  mtt_procedure:
    step_1: "Seed cells in 96-well plates, allow 24 h attachment"
    step_2: "Remove medium, add serial dilutions of test compounds (0.1-1000 ug/mL)"
    step_3: "Incubate for 24-48 hours"
    step_4: "Add MTT reagent (0.5 mg/mL final), incubate 2-4 hours"
    step_5: "Remove medium, solubilize formazan with DMSO + 0.1% Triton X-100"
    step_6: "Measure absorbance at 570 nm (reference 630-650 nm)"
    step_7: "Calculate cell viability and IC50 using GraphPad Prism or similar"
  concentration_preparation:
    pure_compounds: "Dissolve in DMSO (stock 10 mM), dilute to working concentrations"
    plant_extracts: "Prepare standardized extracts with known compound concentrations"
    solvent_control: "DMSO final concentration not exceed 0.5 percent in wells"
  data_analysis:
    ic50_calculation: "Non-linear regression (log[inhibitor] vs response -- Variable slope)"
    viability_calculation: "(Test absorbance - blank) / (Control absorbance - blank) x 100"
    statistical_test: "One-way ANOVA with Dunnett's post-hoc test vs control"

control_strains:
  negative_control: "Cell culture medium only"
  positive_control: "Doxorubicin (1-10 uM)"
  vehicle_control: "Equivalent DMSO concentration"
  wild_type_extractions:
    - "Neem seed oil extract (azadirachtin A standardized)"
    - "Tulsi essential oil (eugenol standardized)"
    - "Stevia leaf extract (total steviol glycosides standardized)"

quality_assurance:
