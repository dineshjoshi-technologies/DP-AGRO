# Grafana Alert Rules - AI-Agriculture Metrics (DPA-84)
# Provisioned via: grafana/provisioning/alerts/alerts.yaml
# Spec §1.3: Alert rules for the metrics dashboard

groups:
  - name: ai_agriculture_kpis
    interval: 5m
    rules:
      - alert: SensorCoverageLow
        expr: sensor_coverage < 80
        for: 2h
        labels:
          severity: warning
          team: mlops
        annotations:
          summary: "Sensor data coverage dropped below 80%"
          description: "Coverage is {{ $value }}%. Phase 1 target is >= 90%."
          runbook: "Check farm sensor network status; verify IoT ingest pipeline is running."

      - alert: SensorCoverageCritical
        expr: sensor_coverage < 50
        for: 1h
        labels:
          severity: critical
          team: mlops
        annotations:
          summary: "Sensor data coverage critically low"
          description: "Coverage is {{ $value }}%. Immediate investigation required."

      - alert: YieldRmseHigh
        expr: yield_rmse > 0.18
        for: 3d
        labels:
          severity: warning
          team: ml-ops
        annotations:
          summary: "Yield prediction RMSE exceeded threshold"
          description: "RMSE is {{ $value }} t/ha. Phase 1 target is <= 0.15, page at > 0.18."
          runbook: "Review model retraining pipeline; check for data drift in sensor inputs."

      - alert: AuditTrailGap
        expr: audit_gap_minutes > 15
        for: 5m
        labels:
          severity: critical
          team: blockchain
        annotations:
          summary: "Blockchain audit trail gap detected"
          description: "Audit gap is {{ $value }} minutes. >15 min triggers ticket to Blockchain team."
          runbook: "Coordinate with Blockchain Integration lead (DPA-79) to investigate smart contract events."

      - alert: LaborHoursBelowTarget
        expr: labor_hours_saved < 20
        for: 7d
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "Labor hours saved below Phase 1 target"
          description: "Labor hours saved is {{ $value }} hrs/season. Target is >= 20 hrs/farm/season."
