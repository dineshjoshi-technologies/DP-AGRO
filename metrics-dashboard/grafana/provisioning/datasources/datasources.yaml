apiVersion: 1

datasources:
  - name: Postgres Metrics
    type: postgres
    access: proxy
    url: postgres:5432
    database: metrics
    user: metrics
    secureJsonData:
      password: ${PG_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    isDefault: true
    editable: false

  - name: Polygon Audit Chain
    uid: polygon-audit
    type: grafana-polystat-panel
    orgId: 1
    access: proxy
    isDefault: false
    editable: false