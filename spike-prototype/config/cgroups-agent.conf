# cgroups v2 configuration for agent sandbox
# Apply with: systemd-run --scope --user -p "Delegate=yes" --slice=agents.slice

[Slice]
CPUQuota=100000
CPUPeriod=100000
MemoryMax=536870912
TasksMax=256
IOReadBandwidthMax=/dev/disk/by-id/root 10485760
IOWriteBandwidthMax=/dev/disk/by-id/root 10485760

