              body += '\n';
            }
            
            if (toChange.length > 0) {
              body += `**To change (${toChange.length}):**\n`;
              for (const r of toChange.slice(0, 20)) {
                body += `- \`${r.address}\`\n`;
              }
              if (toChange.length > 20) body += `- ... and ${toChange.length - 20} more\n`;
              body += '\n';
            }
            
            if (toDestroy.length > 0) {
              body += `**To destroy (${toDestroy.length}):**\n`;
              for (const r of toDestroy.slice(0, 20)) {
                body += `- \`${r.address}\`\n`;
              }
              if (toDestroy.length > 20) body += `- ... and ${toDestroy.length - 20} more\n`;
              body += '\n';
