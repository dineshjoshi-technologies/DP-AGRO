name: Terraform Drift Detection

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  drift-detection-aws:
    name: Drift Detection (AWS)
    if: ${{ secrets.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
          terraform_wrapper: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Initialize Terraform (Staging)
        run: |
          terraform init -backend-config="bucket=${{ secrets.AWS_TERRAFORM_STATE_BUCKET }}" -backend-config="key=${{ github.event.repository.name }}/staging/terraform.tfstate" -backend-config="dynamodb_table=${{ secrets.AWS_TERRAFORM_LOCKS_TABLE }}"

      - name: Check Drift (Staging)
        id: drift-staging
        run: |
          terraform plan -var="environment=staging" -detailed-exitcode -out=tfplan-staging || true
          exit_code=$?
          if [ $exit_code -eq 2 ]; then
            echo "drift=true" >> $GITHUB_OUTPUT
            terraform show -json tfplan-staging > tfplan-staging.json
          else
            echo "drift=false" >> $GITHUB_OUTPUT
          fi

      - name: Initialize Terraform (Production)
        run: |
          terraform init -backend-config="bucket=${{ secrets.AWS_TERRAFORM_STATE_BUCKET }}" -backend-config="key=${{ github.event.repository.name }}/production/terraform.tfstate" -backend-config="dynamodb_table=${{ secrets.AWS_TERRAFORM_LOCKS_TABLE }}"

      - name: Check Drift (Production)
        id: drift-prod
        run: |
          terraform plan -var="environment=production" -detailed-exitcode -out=tfplan-production || true
          exit_code=$?
          if [ $exit_code -eq 2 ]; then
            echo "drift=true" >> $GITHUB_OUTPUT
            terraform show -json tfplan-production > tfplan-production.json
          else
            echo "drift=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Drift Issue (Staging)
        if: steps.drift-staging.outputs.drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planData = JSON.parse(fs.readFileSync('infra/aws/tfplan-staging.json', 'utf8'));
            const changes = planData.resource_changes || [];
            
            let body = '## ⚠️ Infrastructure Drift Detected (AWS Staging)\n\n';
            body += 'Terraform detected drift between the actual infrastructure and the desired state.\n\n';
            body += '### Changes Required\n\n';
            
            const toAdd = changes.filter(r => r.change.actions.includes('create'));
            const toChange = changes.filter(r => r.change.actions.includes('update'));
            const toDestroy = changes.filter(r => r.change.actions.includes('delete'));
            
            if (toAdd.length > 0) {
              body += `**To add (${toAdd.length}):**\n`;
              for (const r of toAdd.slice(0, 20)) {
                body += `- \`${r.address}\`\n`;
              }
              if (toAdd.length > 20) body += `- ... and ${toAdd.length - 20} more\n`;
              body += '\n';
            }
            
            if (toChange.length > 0) {
              body += `**To change (${toChange.length}):**\n`;
              for (const r of toChange.slice(0, 20)) {
                body += `- \`${r.address}\`\n`;
              }
              if (toChange.length > 20) body += `- ... and ${toChange.length - 20} more\n`;
              body += '\n';
            }
            
            if (toDestroy.length > 0) {
              body += `**To destroy (${toDestroy.length}):**\n`;
              for (const r of toDestroy.slice(0, 20)) {
                body += `- \`${r.address}\`\n`;
              }
              if (toDestroy.length > 20) body += `- ... and ${toDestroy.length - 20} more\n`;
              body += '\n';
            }
            
            body += '---\n';
            body += '*Run the "Terraform Apply" workflow manually for AWS Staging to reconcile.*\n';
            
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[DRIFT] AWS Staging infrastructure drift detected',
              body: body,
              labels: ['drift', 'aws', 'staging', 'infrastructure']
            });
            
            console.log(`Created issue #${issue.number}: ${issue.html_url}`);

